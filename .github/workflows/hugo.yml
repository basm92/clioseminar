name: Build and deploy site

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queued runs are not cancelled, so a push that
# lands mid-deploy still gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this in step with the version used locally. The DoIt theme needs
      # Hugo 0.146.0 or newer, and the "extended" build (it compiles SCSS).
      HUGO_VERSION: 0.162.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The theme lives in themes/DoIt as a submodule.
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
